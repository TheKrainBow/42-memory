services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${APP_PORT:-3000}
      DB_PATH: ${DB_PATH:-/data/piscine-games.sqlite}
      THEME: ${THEME:-ALLIANCE}
    ports:
      - "${HOST_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
